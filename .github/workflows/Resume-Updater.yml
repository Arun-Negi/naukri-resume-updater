name: Update Naukri Resume

on:
  schedule:
    # GitHub Actions cron uses UTC; preserve the intended 1 AM, 7 AM, and 12 PM IST runs.
    - cron: '30 19 * * 0-6' # 01:00 IST (previous UTC day)
    - cron: '30 1 * * 0-6'  # 07:00 IST
    - cron: '30 6 * * 0-6'  # 12:00 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naukri-resume-update
  cancel-in-progress: false

jobs:
  update-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Print IST current time
        run: echo "Current IST time: $(TZ='Asia/Kolkata' date)"

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Sign in and upload resume through the browser
        env:
          NAUKRI_USERNAME: ${{ secrets.NAUKRI_USERNAME }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          # Optional: configure only if Naukri offers authenticator-app TOTP for this account.
          NAUKRI_TOTP_SECRET: ${{ secrets.NAUKRI_TOTP_SECRET }}
          GOOGLE_DRIVE_FILE_ID: ${{ secrets.GOOGLE_DRIVE_FILE_ID }}
        run: python upload_resume.py
