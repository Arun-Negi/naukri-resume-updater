name: Naukri Resume Refresh (IST Schedule)

on:
  schedule:
    # GitHub Actions cron uses UTC; 01:00, 07:00, and 12:00 India Standard Time.
    - cron: '30 19 * * 0-6' # 01:00 IST (previous UTC day)
    - cron: '30 1 * * 0-6'  # 07:00 IST
    - cron: '30 6 * * 0-6'  # 12:00 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naukri-resume-refresh
  cancel-in-progress: false

jobs:
  refresh-resume:
    name: Refresh Naukri resume
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Show scheduled run time (IST)
        run: echo "Current IST time: $(TZ='Asia/Kolkata' date)"

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install browser dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Sign in with Naukri username and password, then refresh resume
        env:
          NAUKRI_USERNAME: ${{ secrets.NAUKRI_USERNAME }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          NAUKRI_TOTP_SECRET: ${{ secrets.NAUKRI_TOTP_SECRET }}
          GOOGLE_DRIVE_FILE_ID: ${{ secrets.GOOGLE_DRIVE_FILE_ID }}
        run: python upload_resume.py
