name: Update Naukri Resume

on:
  schedule:
    # GitHub Actions cron uses UTC; these correspond to 1 AM, 7 AM, and 12 PM IST.
    # Explicit 0-6 day-of-week range refreshes the schedule without changing run times.
    - cron: '30 19 * * 0-6' # 01:00 IST (previous UTC day)
    - cron: '30 1 * * 0-6'  # 07:00 IST
    - cron: '30 6 * * 0-6'  # 12:00 IST
  workflow_dispatch:

jobs:
  update-resume:
    runs-on: ubuntu-latest

    steps:
      - name: Print IST current time
        run: |
          echo "Current IST time: $(TZ='Asia/Kolkata' date)"

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run resume updater
        env:
          NAUKRI_COOKIES:       ${{ secrets.NAUKRI_COOKIES }}
          GOOGLE_DRIVE_FILE_ID: ${{ secrets.GOOGLE_DRIVE_FILE_ID }}
          NAUKRI_FORM_KEY:      ${{ secrets.NAUKRI_FORM_KEY }}
        run: python updateDaily.py
